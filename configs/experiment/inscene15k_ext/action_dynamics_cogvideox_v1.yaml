# @package _global_
# action_dynamics probe with cogvideox features

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42

tags: ["train", "inscene15k_ext", "cogvideox", "action_dynamics"]

task_name: inscene15k_ext
job_name: action_dynamics_cogvideox_v1

autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: _t749_layer20
target_feat_root: /nas/baiqiao/InsScene-15K/FEAT_TARGET
data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='/nas/baiqiao/InsScene-15K/data', root_vfm='/nas/baiqiao/InsScene-15K/FEAT', sources=['processed_infinigen', 'processed_scannetpp_v2'], split='train', vfm_name='cogvideox', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=False, diag_action=True, target_feat_root='${target_feat_root}')
    validation_datasets:
    - InsScene15KDataset(root='/nas/baiqiao/InsScene-15K/data', root_vfm='/nas/baiqiao/InsScene-15K/FEAT', sources=['processed_infinigen', 'processed_scannetpp_v2'], split='val', vfm_name='cogvideox', feat_postfix='${feat_postfix}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=False, diag_action=True, target_feat_root='${target_feat_root}')
    batch_size_per_device: 4
    batch_size_per_device_val: 4
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: action_dynamics
  probe:
    _target_: vidfm3d.models.components.probe_action_dynamics.ActionDynamicsProbe
    in_channels: 3072
    action_dim: 9
    hidden_dim: 512
    num_layers: 2
    num_heads: 8

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 50
  precision: bf16-mixed
  plugins: []
