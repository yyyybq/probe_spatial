# @package _global_
# SAE diagnostic for BAGEL unified-model activations.

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42

tags: ["train", "inscene15k_ext", "bagel", "sae_spatial"]

task_name: inscene15k_ext
job_name: sae_bagel_v1

autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: _layer-1
feature_layer: null
feature_timestep: 749
data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${oc.env:INSCENE_MLLM_FEAT_ROOT}', sources=['processed_scannetpp_v2'], split='train', vfm_name='bagel', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=True, diag_overlap=True, diag_hidden_obj=True)
    validation_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${oc.env:INSCENE_MLLM_FEAT_ROOT}', sources=['processed_scannetpp_v2'], split='val', vfm_name='bagel', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=True, diag_overlap=True, diag_hidden_obj=True)
    batch_size_per_device: 2
    batch_size_per_device_val: 2
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: sae_spatial
  sae_l1_weight: 1e-4
  sae_overlap_weight: 0.2
  sae_ego_weight: 0.2
  probe:
    _target_: vidfm3d.models.components.probe_sae_spatial.TopKSAESpatialProbe
    in_channels: 3584
    dict_size: 16384
    k: 64
    hidden_dim: 512
    max_tokens_per_batch: 8192
    detach_readout: true
    use_overlap_readout: true
    use_ego_readout: true

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 30
  precision: bf16-mixed
  plugins: []
