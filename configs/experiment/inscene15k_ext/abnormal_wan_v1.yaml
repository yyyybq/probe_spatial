# @package _global_
# A3: Abnormal Video (temporal coherence) Probe with Wan features
# Requires shuffled-context features extracted via `--mode shuffled` from features/run_inscene15k.py

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42

tags: ["train", "inscene15k_ext", "wan", "abnormal"]

task_name: inscene15k_ext
job_name: abnormal_wan_v1

autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: _t749_layer20
feature_layer: null
feature_timestep: 749
shuffled_feat_root: ${oc.env:INSCENE_SHUFFLED_FEAT_ROOT}
data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${oc.env:INSCENE_FEAT_ROOT}', sources=['processed_infinigen', 'processed_scannetpp_v2'], split='train', vfm_name='wan', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=False, diag_abnormal=True, shuffled_feat_root='${shuffled_feat_root}', allow_missing_vfm=True)
    validation_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${oc.env:INSCENE_FEAT_ROOT}', sources=['processed_infinigen', 'processed_scannetpp_v2'], split='val', vfm_name='wan', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=False, diag_abnormal=True, shuffled_feat_root='${shuffled_feat_root}', allow_missing_vfm=True)
    batch_size_per_device: 4
    batch_size_per_device_val: 4
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: abnormal
  probe:
    _target_: vidfm3d.models.components.probe_abnormal.AbnormalVideoProbe
    in_channels: 1536
    hidden_dim: 512
    num_heads: 8
    num_layers: 2
    max_seq_len: 16

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 50
  precision: bf16-mixed
  plugins: []
