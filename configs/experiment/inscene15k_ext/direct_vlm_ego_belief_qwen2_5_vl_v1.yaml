# @package _global_
# Direct B1 probe on Qwen2.5-VL visual-token activations, no SAE.

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42
tags: ["train", "inscene15k_ext", "qwen2_5_vl", "direct_vlm", "ego_belief"]

task_name: inscene15k_ext
job_name: direct_vlm_ego_belief_qwen2_5_vl_v1
autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: _layer-1
feature_layer: null
feature_timestep: 749
vfm_name: qwen2_5_vl
video_channels: 3584
vlm_feat_root: ${oc.env:INSCENE_MLLM_FEAT_ROOT}

data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${vlm_feat_root}', sources=['processed_scannetpp_v2'], split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=True, diag_hidden_obj=True)
    validation_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${vlm_feat_root}', sources=['processed_scannetpp_v2'], split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=4, min_view_interval=5, context_len=76, query_idx_divisor=4, target_h=288, target_w=512, window_size=200, include_pmaps=True, diag_hidden_obj=True)
    batch_size_per_device: 2
    batch_size_per_device_val: 2
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: ego_belief
  probe:
    _target_: vidfm3d.models.components.probe_ego_belief.EgoBeliefProbe
    in_channels: ${video_channels}
    decoder_type: transformer
    num_frames: 4
    use_final_global_feature: true
    hidden_dim: 512
    num_layers: 2
    num_heads: 8
    max_seq_len: 16

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 50
  precision: bf16-mixed
  plugins: []
