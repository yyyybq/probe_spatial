# @package _global_
# B1: Hidden-object localization under the shared streaming-prefix protocol.

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42
tags: ["train", "inscene15k_streaming", "dino", "streaming_prefix", "ego_belief"]

task_name: inscene15k_streaming
job_name: ego_belief_dino_v1
autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: ""
feature_layer: null
feature_timestep: 749
vfm_name: dino
video_channels: 1024
prefix_len: 8
streaming_hidden_seed_prefix_len: 8
streaming_hidden_prefix_lengths: [8, 12, 16, 24]
streaming_feat_root: ${oc.env:INSCENE_STREAMING_FEAT_ROOT}

data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${streaming_feat_root}', streaming_feat_root='${streaming_feat_root}', sources=['processed_scannetpp_v2'], split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=${prefix_len}, min_view_interval=5, context_len=76, query_idx_divisor=None, target_h=288, target_w=512, window_size=0, include_pmaps=True, streaming_prefix=True, prefix_min_len=${prefix_len}, prefix_max_len=${prefix_len}, prefix_stride=1, diag_hidden_obj=True, streaming_shared_hidden_obj=True, streaming_hidden_seed_prefix_len=${streaming_hidden_seed_prefix_len}, streaming_hidden_prefix_lengths=${streaming_hidden_prefix_lengths})
    validation_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${streaming_feat_root}', streaming_feat_root='${streaming_feat_root}', sources=['processed_scannetpp_v2'], split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=${prefix_len}, min_view_interval=5, context_len=76, query_idx_divisor=None, target_h=288, target_w=512, window_size=0, include_pmaps=True, streaming_prefix=True, prefix_min_len=${prefix_len}, prefix_max_len=${prefix_len}, prefix_stride=1, diag_hidden_obj=True, streaming_shared_hidden_obj=True, streaming_hidden_seed_prefix_len=${streaming_hidden_seed_prefix_len}, streaming_hidden_prefix_lengths=${streaming_hidden_prefix_lengths})
    batch_size_per_device: 4
    batch_size_per_device_val: 4
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: ego_belief
  probe:
    _target_: vidfm3d.models.components.probe_ego_belief.EgoBeliefProbe
    in_channels: ${video_channels}
    decoder_type: transformer
    num_frames: ${prefix_len}
    use_final_global_feature: true
    hidden_dim: 512
    num_layers: 2
    num_heads: 8
    max_seq_len: 64

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 50
  precision: bf16-mixed
  plugins: []
