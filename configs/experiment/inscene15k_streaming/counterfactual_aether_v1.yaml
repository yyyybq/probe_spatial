# @package _global_
# C3: Counterfactual action prediction under the shared streaming-prefix protocol.

defaults:
  - override /model: probe_ext
  - override /callbacks: v3_checkpoint

seed: 42
tags: ["train", "inscene15k_streaming", "aether", "streaming_prefix", "counterfactual"]

task_name: inscene15k_streaming
job_name: counterfactual_aether_v1
autoresume: true

paths:
  run_folder_name: ${task_name}_${job_name}

feat_postfix: _t749_layer1
feature_layer: null
feature_timestep: 749
vfm_name: aether
video_channels: 3072
prefix_len: 8
streaming_feat_root: ${oc.env:INSCENE_STREAMING_FEAT_ROOT}
target_feat_root: ${oc.env:INSCENE_TARGET_FEAT_ROOT,}
action_horizons: [1, 2, 4]
counterfactual_min_overlap: 0.05

data:
  data_module:
    train_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${streaming_feat_root}', streaming_feat_root='${streaming_feat_root}', sources=['processed_scannetpp_v2'], split='train', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=${prefix_len}, min_view_interval=5, context_len=${prefix_len}, query_idx_divisor=None, target_h=288, target_w=512, window_size=0, include_pmaps=True, streaming_prefix=True, prefix_min_len=${prefix_len}, prefix_max_len=${prefix_len}, prefix_stride=1, diag_counterfactual=True, target_feat_root='${target_feat_root}', action_horizons=${action_horizons}, counterfactual_min_overlap=${counterfactual_min_overlap})
    validation_datasets:
    - InsScene15KDataset(root='${oc.env:INSCENE_DATA_ROOT}', root_vfm='${streaming_feat_root}', streaming_feat_root='${streaming_feat_root}', sources=['processed_scannetpp_v2'], split='val', vfm_name='${vfm_name}', feat_postfix='${feat_postfix}', feature_layer='${feature_layer}', feature_timestep='${feature_timestep}', feat_pixalign=True, num_views=${prefix_len}, min_view_interval=5, context_len=${prefix_len}, query_idx_divisor=None, target_h=288, target_w=512, window_size=0, include_pmaps=True, streaming_prefix=True, prefix_min_len=${prefix_len}, prefix_max_len=${prefix_len}, prefix_stride=1, diag_counterfactual=True, target_feat_root='${target_feat_root}', action_horizons=${action_horizons}, counterfactual_min_overlap=${counterfactual_min_overlap})
    batch_size_per_device: 4
    batch_size_per_device_val: 4
    num_workers: 8
    num_workers_val: 4

logger:
  wandb:
    name: ${task_name}_${job_name}
    group: ${task_name}

model:
  probe_type: counterfactual
  probe:
    _target_: vidfm3d.models.components.probe_counterfactual.CounterfactualProbe
    in_channels: ${video_channels}
    action_dim: 9
    hidden_dim: 512
    num_layers: 2
    num_heads: 8
    max_horizons: 4

trainer:
  devices: [0]
  strategy: auto
  max_epochs: 50
  precision: bf16-mixed
  plugins: []
