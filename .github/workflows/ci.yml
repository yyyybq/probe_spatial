name: ci
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.6.0 lightning==2.6.1 lightning-bolts==0.7.0 torchmetrics==1.9.0 hydra-core==1.3.2 rootutils safetensors numpy pytest
      - run: pip install -e .
      - run: pytest -q
